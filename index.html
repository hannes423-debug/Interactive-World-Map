<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive World Map</title>
<meta name="description" content="Map-based career and league selection for games.">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #050b15; color: #e8eef7; font: 15px/1.5 "Inter", "Segoe UI", system-ui, sans-serif; }
  body { background: linear-gradient(180deg, rgba(5, 11, 21, 0.55), #050b15 85%), url("assets/maps/world.png") center top / cover no-repeat fixed; }
  main { max-width: 760px; margin: 0 auto; padding: 14vh 20px 60px; }
  .eyebrow { margin: 0; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #8fd0ff; font-weight: 600; }
  h1 { margin: 6px 0 10px; font: 600 42px/1.05 "Barlow Condensed", "Bahnschrift", "Arial Narrow", sans-serif; letter-spacing: 0.03em; text-transform: uppercase; }
  p { color: #a9b6c9; }
  ul { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 10px; }
  a.game { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 12px; text-decoration: none; color: inherit; background: rgba(10, 17, 30, 0.85); border: 1px solid rgba(160, 190, 230, 0.18); transition: border-color 0.15s, background 0.15s; }
  a.game:hover, a.game:focus-visible { border-color: rgba(143, 208, 255, 0.55); background: rgba(14, 24, 42, 0.92); outline: none; }
  a.game strong { display: block; font-size: 17px; }
  a.game span { color: #a9b6c9; font-size: 13px; }
  .go { color: #8fd0ff; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Interactive World Map</p>
  <h1>Career map prototypes</h1>
  <p>A reusable world map and league-selection interface. Each game supplies its own territories, leagues and teams as data files.</p>
  <ul id="games">
    <li><a class="game" href="career-map.html?game=nhl13#/world"><span><strong>NHL 13 · Modern Career</strong><span>2026–27 season · North America, Europe, Russia &amp; Eurasia</span></span><span class="go">Open map ›</span></a></li>
  </ul>
</main>
</body>
</html>
